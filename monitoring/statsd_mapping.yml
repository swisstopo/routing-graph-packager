mappings:
  - match: rgp.build.stage.duration
    name: rgp_build_stage_duration_seconds
    timer_type: histogram
    histogram_options:
      buckets: [10, 60, 300, 900, 1800, 3600, 7200, 14400, 28800, 57600]

  - match: rgp.build.duration
    name: rgp_build_duration_seconds
    timer_type: histogram
    histogram_options:
      buckets: [60, 300, 900, 1800, 3600, 7200, 14400, 28800, 57600, 115200]

  - match: rgp.build.*
    name: rgp_build_total
    labels:
      outcome: "$1"

  - match: valhalla.mjolnir.timing.*.*
    name: valhalla_build_stage_duration_seconds
    labels:
      module: "$1"
      stage: "$2"
