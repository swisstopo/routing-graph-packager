mappings:
  - match: rgp.http.duration
    name: rgp_http_duration_seconds
    timer_type: histogram
    histogram_options:
      buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]

  - match: rgp.http.requests
    name: rgp_http_requests_total

  - match: rgp.package.duration
    name: rgp_package_duration_seconds
    timer_type: histogram
    histogram_options:
      buckets: [1, 5, 15, 30, 60, 300, 900, 1800, 3600, 7200]

  - match: rgp.package.*
    name: rgp_package_total
    labels:
      outcome: "$1"

  - match: rgp.build.stage.duration
    name: rgp_build_stage_duration_seconds
    timer_type: histogram
    histogram_options:
      buckets: [10, 60, 300, 900, 1800, 3600, 7200, 14400, 28800, 57600]

  - match: rgp.build.duration
    name: rgp_build_duration_seconds
    timer_type: histogram
    histogram_options:
      buckets: [60, 300, 900, 1800, 3600, 7200, 14400, 28800, 57600, 115200]

  - match: rgp.build.*
    name: rgp_build_total
    labels:
      outcome: "$1"

  - match: valhalla.mjolnir.timing.*
    name: valhalla_build_stage_duration_seconds
    labels:
      stage: "$1"
    timer_type: histogram
    histogram_options:
      buckets: [10, 60, 300, 900, 1800, 3600, 7200, 14400, 28800, 57600]
